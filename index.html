<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f2ec" />
<meta name="robots" content="noindex, nofollow" />
<title>Welcome · Modern Townhome Seattle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  :root {
    --bg: #f7f2ec;
    --card: #ffffff;
    --row: #f3efea;
    --ink: #2b2825;
    --muted: #6d665f;
    --accent: #4f5d43;
    --soft: #efe4d6;
    --line: #e7dfd5;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; color-scheme: light; -webkit-tap-highlight-color: transparent; }
  body.open { overflow: hidden; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 0 calc(110px + env(safe-area-inset-bottom)); }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
  .kicker { letter-spacing: .28em; text-transform: uppercase; font-size: 12px; color: var(--ink); text-align: center; }

  .page { display: none; animation: fade .35s ease; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .hero { position: relative; height: 280px; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, var(--bg) 100%); }
  .home-title { text-align: center; margin-top: -40px; position: relative; z-index: 1; padding: 0 20px 22px; }
  .home-title h1 { font-size: 64px; line-height: 1; }
  .home-title p.sub { margin-top: 10px; }
  .home-title .prop { margin-top: 14px; font-size: 14px; color: var(--muted); }
  .menu { list-style: none; }
  .menu a {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 26px; margin-bottom: 14px;
    background: var(--row); color: inherit; text-decoration: none;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    transition: background .2s;
  }
  .menu a:active, .menu a:hover { background: #ebe5dd; }
  .menu svg.ic { width: 28px; height: 28px; flex: none; stroke: var(--ink); stroke-width: 1.2; fill: none; }
  .menu .txt { flex: 1; }
  .menu .txt b { display: block; font-weight: 600; font-size: 15px; }
  .menu .txt span { font-size: 14px; color: var(--muted); }
  .menu .chev { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.4; }

  .section { padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); }
  .section > .kicker { margin: 8px 0 18px; }
  .title-card { background: var(--card); border-radius: var(--radius); padding: 18px; text-align: center; margin-bottom: 14px; }
  .title-card h2 { font-size: 40px; line-height: 1.1; }
  .photo { width: 100%; height: 190px; object-fit: cover; border-radius: var(--radius); display: block; margin-bottom: 14px; background: var(--soft); }
  .card { background: var(--card); border-radius: var(--radius); padding: 22px 20px 22px 54px; margin: 0 0 14px 12px; position: relative; }
  .card.plain { padding: 22px 20px; text-align: center; margin-left: 0; }
  .card h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .card p, .card li { font-size: 15px; }
  .card p + p { margin-top: 8px; }
  .card ul { list-style: none; }
  .card li { padding: 3px 0; }
  .card .badge {
    position: absolute; left: -12px; top: 18px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--soft); display: grid; place-items: center;
  }
  .card .badge svg { width: 24px; height: 24px; stroke: var(--ink); stroke-width: 1.3; fill: none; }
  .card a { color: var(--accent); font-weight: 500; }
  .card li a, .card p a { display: inline-block; padding: 8px 0; margin: -4px 0; }
  .note { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .arch { background: var(--card); border-radius: 200px 200px var(--radius) var(--radius); padding: 60px 20px 36px; text-align: center; margin-bottom: 14px; }
  .arch .ring { width: 74px; height: 74px; border-radius: 50%; border: 1.5px solid #d8cbbb; display: grid; place-items: center; margin: 0 auto 18px; }
  .arch .ring svg { width: 40px; height: 40px; stroke: #b9a891; stroke-width: 1.3; fill: none; }
  .arch h2 { font-size: 58px; line-height: 1; }
  .creds { background: var(--card); border-radius: var(--radius); padding: 30px 24px; text-align: center; }
  .creds .label { letter-spacing: .25em; font-size: 14px; text-transform: uppercase; margin: 0 0 10px; }
  .creds .label:not(:first-child) { margin-top: 24px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--ink); color: #fff; border: 0; border-radius: 999px;
    padding: 14px 26px; min-width: 220px; max-width: 100%; min-height: 44px; font: 600 15px/1.3 "DM Sans", sans-serif; letter-spacing: .06em; cursor: pointer;
    word-break: break-all; -webkit-user-select: all; user-select: all;
  }
  .pill svg { width: 14px; height: 14px; flex: none; stroke: #fff; fill: none; stroke-width: 2; opacity: .7; }
  .speed { margin-top: 22px; font-size: 13px; color: var(--muted); }
  .speed a { color: var(--accent); font-weight: 500; display: inline-block; padding: 8px 0; margin: -8px 0; }
  .ring.sm { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #d8cbbb; display: grid; place-items: center; margin: 0 auto 14px; }
  .ring.sm svg { width: 26px; height: 26px; stroke: #b9a891; stroke-width: 1.4; fill: none; }
  .wifi-note { font-size: 15px; margin: 0 auto 20px; max-width: 320px; }
  .steps { text-align: left; max-width: 320px; margin: 0 auto; }
  .step { display: flex; gap: 14px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; }
  .step .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .step p { font-size: 15px; padding-top: 2px; }

  .gallery { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px 14px; padding: 0 18px; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery figure { flex: 0 0 82%; scroll-snap-align: center; }
  .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius); display: block; }
  .gallery figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }

  .btn {
    display: block; text-align: center; background: var(--accent); color: #fff !important; text-decoration: none;
    padding: 13px; border-radius: 999px; font-weight: 600; margin-top: 14px;
  }
  .btn.ghost { background: transparent; color: var(--ink) !important; border: 1.5px solid var(--ink); }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 15px; min-height: 44px; padding-right: 16px; }
  .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 30px 20px 0; }

  .fab {
    position: fixed; right: max(18px, calc(50% - 222px)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20;
    width: 56px; height: 56px; border-radius: 50%; background: var(--ink); border: 0;
    display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer;
  }
  .fab svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 1.5; fill: none; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(30,26,22,.4); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
  .drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 480px; margin: 0 auto;
    background: var(--bg); border-radius: 22px 22px 0 0; padding: 18px 0 calc(20px + env(safe-area-inset-bottom)); max-height: 85vh; max-height: 85dvh; overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(105%); transition: transform .3s ease;
  }
  .drawer .grab { width: 40px; height: 4px; border-radius: 4px; background: #cfc4b6; margin: 0 auto 14px; }
  .drawer .menu a { margin-bottom: 6px; padding: 12px 26px; }
  body.open .drawer-bg { opacity: 1; pointer-events: auto; }
  body.open .drawer { transform: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; transition: all .25s; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Nearby map + list */
  .places-wrap > .kicker { margin: 10px 0 12px; }
  .map { height: 320px; border-radius: var(--radius); margin-bottom: 12px; z-index: 0; background: var(--soft); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px 12px; padding: 0 18px; scrollbar-width: none; }
  @media (hover: hover) and (pointer: fine) {
    .chips { flex-wrap: wrap; justify-content: center; overflow: visible; margin: 0 0 12px; padding: 0; }
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; min-height: 40px; font: 500 14px "DM Sans", sans-serif; cursor: pointer; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .places { list-style: none; background: var(--card); border-radius: var(--radius); padding: 4px 0; margin-bottom: 14px; }
  .place { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .place:first-child { border-top: 0; }
  .place.hide { display: none; }
  .place.sel { background: var(--row); }
  .pin { flex: none; width: 26px; height: 26px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .place .info { flex: 1; min-width: 0; }
  .place b { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .place small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .place .dist { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .place .dist b { color: var(--ink); font-size: 14px; }
  .place .go { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); }
  @media (max-width: 360px) { .place { gap: 9px; padding: 11px 10px; } .place .dist { font-size: 12px; } .place b { font-size: 14px; } }
  .place .go svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.6; }
  .home-pin { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: grid; place-items: center; }
  .home-pin svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.8; }
  .map-pin { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; font: 600 11px "DM Sans", sans-serif; }
  .leaflet-popup-content { font: 14px/1.4 "DM Sans", sans-serif; margin: 12px 14px; }
  .leaflet-popup-content a.btn { margin-top: 8px; padding: 9px 14px; font-size: 14px; }

  @media print {
    .topnav { display: none !important; }
  }

  /* ---------- Desktop layout (wide screens only; phones unchanged) ---------- */
  .topnav { display: none; }
  @media screen and (min-width: 900px) {
    .app { max-width: 1120px; padding: 0 32px 60px; }
    .fab, .drawer, .drawer-bg, .back { display: none !important; }

    .topnav {
      display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 25;
      background: rgba(247,242,236,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); padding: 14px max(32px, calc(50% - 528px));
    }
    .topnav .brand { font-family: "Instrument Serif", Georgia, serif; font-size: 26px; color: var(--ink); text-decoration: none; white-space: nowrap; margin-right: auto; }
    .topnav nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
    .topnav nav a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 8px 12px; border-radius: 999px; transition: background .2s, color .2s; }
    .topnav nav a:hover { background: var(--row); color: var(--ink); }
    .topnav nav a.on { background: var(--ink); color: #fff; }

    /* Home */
    .hero { height: 460px; border-radius: 0 0 24px 24px; }
    .home-title { margin-top: -70px; padding-bottom: 36px; }
    .home-title h1 { font-size: 104px; }
    .home-title .prop { font-size: 16px; }
    #p-home .menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    #p-home .menu a { margin: 0; height: 100%; flex-direction: column; align-items: flex-start; gap: 14px; padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); transition: transform .2s, box-shadow .2s; }
    #p-home .menu a:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(43,40,37,.08); background: var(--card); }
    #p-home .menu .chev { display: none; }
    #p-home footer { padding-top: 40px; }

    /* Section pages */
    .section { padding: 40px 0 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-content: start; }
    .section > :not(.card), .section > .card.plain { grid-column: 1 / -1; }
    .section > .card { margin-left: 12px; }
    .section > .kicker { margin: 0 0 18px; font-size: 13px; }
    .title-card { padding: 28px; margin-bottom: 20px; }
    .title-card h2 { font-size: 60px; }
    .photo { height: 420px; margin-bottom: 24px; }
    .section > .photo.print-hide { grid-column: auto; height: 240px; margin-bottom: 20px; }
    .card { padding: 26px 26px 26px 60px; margin-bottom: 20px; }
    .card p, .card li { font-size: 16px; }
    .card h3 { font-size: 19px; }
    .card.plain { padding: 28px 40px; font-size: 17px; }

    /* Wi-Fi */
    #p-wifi .section { display: block; max-width: 680px; margin: 0 auto; }
    .arch h2 { font-size: 84px; }

    /* Amenities gallery becomes a photo grid */
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; overflow: visible; margin: 0 0 24px; padding: 0; }
    .gallery img { height: 240px; }

    /* Explore: map beside the list */
    .places-wrap { display: grid; grid-template-columns: 1.3fr 1fr; grid-template-areas: "k k" "c c" "m l" "n n"; column-gap: 20px; margin-top: 8px; }
    .places-wrap > .kicker { grid-area: k; font-size: 13px; }
    .places-wrap > .chips { grid-area: c; }
    .places-wrap > .map { grid-area: m; height: 600px; position: sticky; top: 90px; }
    .places-wrap > .places { grid-area: l; max-height: 600px; overflow-y: auto; margin-bottom: 12px; }
    .places-wrap > .note { grid-area: n; }
    .place:hover { background: var(--row); }

    footer { padding-top: 40px; }
  }

  @media print {
    @page { size: letter; margin: 0.5in; }
    html, body { background: #fff; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 12px; }
    .app { max-width: none; padding: 0; }
    .page { display: block !important; animation: none; break-before: page; }
    #p-home { break-before: auto; }
    .fab, .drawer, .drawer-bg, .toast, .back, .menu .chev, footer { display: none !important; }
    .hero { height: 3.4in; border-radius: 14px; }
    .home-title h1 { font-size: 72px; }
    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .menu a { margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
    .section { padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-content: start; }
    .section > :not(.card), .section > .card.plain { grid-column: 1 / -1; }
    .section > .card { margin-left: 12px; }
    .print-hide { display: none !important; }
    .section > .kicker { margin-top: 0; }
    .title-card { background: var(--row); }
    .title-card h2 { font-size: 38px; }
    .photo { height: 3in; }
    #p-explore .photo { height: 1.6in; }
    .card { background: var(--row); break-inside: avoid; padding: 18px 18px 18px 50px; margin-bottom: 12px; }
    .card.plain { background: var(--row); }
    .card h3 { font-size: 16px; }
    .card p, .card li { font-size: 13.5px; }
    .card li a, .card p a { padding: 0; margin: 0; text-decoration: none; }
    .btn { display: none; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow: visible; margin: 0 0 10px; padding: 0; }
    .gallery img { height: 1.5in; }
    .gallery figure:nth-child(n+7) { display: none; }
    .map, .chips, .place .go { display: none !important; }
    .places { columns: 2; column-gap: 10px; background: var(--row); padding: 6px 0; }
    .place { break-inside: avoid; padding: 5px 12px; gap: 8px; display: flex !important; border-top: 0; }
    .place b { font-size: 12.5px; }
    .place small, .place .dist { font-size: 11px; }
    .place .dist b { font-size: 12px; }
    .pin { width: 20px; height: 20px; font-size: 10px; }
    .places-wrap { break-before: page; }
    .arch { background: var(--row); padding: 60px 20px 36px; border-radius: 3in 3in 14px 14px; }
    .arch h2 { font-size: 80px; }
    .creds { background: var(--row); padding: 40px 24px; }
    .pill { font-size: 20px; padding: 18px 40px; min-width: 3.5in; }
    .creds .label { font-size: 16px; }
    .speed { font-size: 14px; }
  }
</style>
</head>
<body>
<header class="topnav" id="topnav"></header>
<div class="app" id="app"></div>

<button class="fab" id="fab" aria-label="Open menu">
  <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer" aria-label="Guide sections"><div class="grab"></div><ul class="menu" id="drawerMenu"></ul></nav>
<div class="toast" id="toast">Copied!</div>

<script>

  primary:  IMG("98db15ff-5954-4032-9374-2965b86c12c1"),
  bath:     IMG("9776a184-9102-4019-ab86-0fd9553d41a4"),
  workspace:IMG("6a701371-11ed-44ea-a40a-5577a4d802cd"),
  laundry:  IMG("7c89ed11-7b76-44f8-bb3e-4e69fc3db1f7"),
  exterior: IMG("f8d6ae25-2e59-41b6-9b5e-47b227e4cce0"),
  exterior2:IMG("50997a24-d788-4062-82ce-f67e6ec01de9"),
  parking:  IMG("c14bc0c8-6880-44be-8808-e7f52ecd61f2"),
  extra:    "https://a0.muscache.com/im/pictures/ae3d2ae9-39d7-490e-8ec2-79d429ee7b72.jpg?im_w=960",
};

const metersFromHome = (lat, lng) => {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat - CONFIG.lat), dLng = toRad(lng - CONFIG.lng);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(CONFIG.lat)) * Math.cos(toRad(lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
};
PLACES.forEach(p => {
  p.m = metersFromHome(p.lat, p.lng) * 1.3; // straight line -> rough street distance
  p.mi = p.m / 1609.34;
  p.travel = p.m <= 1600 ? `${Math.max(1, Math.round(p.m / 80))} min walk` : `${Math.round(p.m / 450) + 2} min drive`;
});
PLACES.sort((a, b) => a.m - b.m);
PLACES.forEach((p, i) => p.n = i + 1);

  const id = (location.hash || "#home").slice(1);
  const page = document.getElementById("p-" + id) || document.getElementById("p-home");
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p === page));
  document.body.classList.remove("open");
  document.querySelectorAll("#topnav nav a").forEach(a => a.classList.toggle("on", "p-" + a.dataset.id === page.id));
  window.scrollTo(0, 0);
  if (page.id === "p-explore") initMap();
}

/* ---------- Explore map ---------- */
let map, markers = {};
function initMap() {
  if (!window.L) return;               // Leaflet failed to load: list still works
  if (map) { setTimeout(() => map.invalidateSize(), 50); return; }
  map = L.map("map", { scrollWheelZoom: false, tap: true }).setView([CONFIG.lat, CONFIG.lng], 14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  L.marker([CONFIG.lat, CONFIG.lng], {
    icon: L.divIcon({ className: "", html: `<div class="home-pin">${svg("house")}</div>`, iconSize: [38, 38], iconAnchor: [19, 19] }),
    zIndexOffset: 1000, title: "The townhome"
  }).addTo(map).bindPopup(`<b>${CONFIG.propertyName}</b><br>You are here`);
  PLACES.forEach(p => {
    markers[p.n] = L.marker([p.lat, p.lng], {
      icon: L.divIcon({ className: "", html: `<div class="map-pin" style="background:${CATS[p.cat].color}">${p.n}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }),
      title: p.name
    }).addTo(map).bindPopup(`<b>${p.name}</b><br><small>${p.addr}</small><br>${p.mi.toFixed(1)} mi · ${p.travel}
      <a class="btn" href="${dirUrl(p)}" target="_blank" rel="noopener">Directions</a>`);
    markers[p.n].on("click", () => highlight(p.n));
  });
  fitTo("all");
}
function fitTo(cat) {
  if (!map) return;
  const pts = PLACES.filter(p => cat === "all" || p.cat === cat).map(p => [p.lat, p.lng]);
  map.fitBounds(L.latLngBounds([[CONFIG.lat, CONFIG.lng], ...pts]), { padding: [24, 24], maxZoom: 16 });
}
function highlight(n) {
  document.querySelectorAll(".place").forEach(li => li.classList.toggle("sel", li.dataset.n == n));
}
document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const cat = c.dataset.cat;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
  document.querySelectorAll(".place").forEach(li => li.classList.toggle("hide", cat !== "all" && li.dataset.cat !== cat));
  if (map) {
    PLACES.forEach(p => { const show = cat === "all" || p.cat === cat; show ? markers[p.n].addTo(map) : markers[p.n].remove(); });
    map.closePopup(); fitTo(cat);
  }
});
document.getElementById("places").addEventListener("click", e => {
  if (e.target.closest(".go")) return;   // directions button opens Google Maps
  const li = e.target.closest(".place"); if (!li || !map) return;
  const m = markers[li.dataset.n];
  highlight(li.dataset.n);
  document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
  map.setView(m.getLatLng(), 16); m.openPopup();
});
addEventListener("hashchange", route);
route();

const toggle = () => document.body.classList.toggle("open");
document.getElementById("fab").onclick = toggle;
document.getElementById("drawerBg").onclick = toggle;

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); }
  catch {
    // iOS Safari fallback (clipboard API requires HTTPS)
    const t = document.createElement("textarea");
    t.value = b.dataset.copy; t.readOnly = true;
    t.style.cssText = "position:fixed;top:0;opacity:0;font-size:16px";
    document.body.appendChild(t); t.focus(); t.setSelectionRange(0, t.value.length);
    document.execCommand("copy"); t.remove();
  }
  const toast = document.getElementById("toast");
  toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1400);
});
</script>
